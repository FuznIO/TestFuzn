services:
  testwebapp:
    image: ${DOCKER_REGISTRY-}testwebapp
    build:
      context: .
      dockerfile: TestWebApp/Dockerfile

  sampleapp.webapp:
    image: ${DOCKER_REGISTRY-}sampleappwebapp
    build:
      context: .
      dockerfile: SampleApp.WebApp/Dockerfile

  # Three workers in pool "docker". They reach the cluster through Cockpit, which runs from the Cockpit
  # repository (start-service.ps1) on http://localhost:5170. In a container, localhost is the container
  # itself: Cockpit and the systems under test are at host.docker.internal. The worker key is the one
  # Cockpit's own docker-compose.yml sets for local use.
  worker:
    image: testfuzn-worker
    build:
      context: .
      dockerfile: TestFuzn.Worker/Dockerfile
    environment:
      - TESTFUZN_COCKPIT_URL=http://host.docker.internal:5170
      - TESTFUZN_WORKER_KEY=testfuzn-local-worker-key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    deploy:
      replicas: 3
