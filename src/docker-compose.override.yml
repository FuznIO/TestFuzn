services:
  testwebapp:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_HTTPS_PORTS=8081
    # The HTTPS dev certificate is resolved by Kestrel's built-in Development
    # certificate convention: the cert is read from $HOME/.aspnet/https/TestWebApp.pfx
    # and its password from the Kestrel:Certificates:Development:Password user secret.
    # Both come from the volume mounts below -- do not hardcode the password here,
    # it is regenerated per machine whenever Visual Studio recreates the certificate.
    ports:
      - "7058:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro

  sampleapp.webapp:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    # See the note on testwebapp above -- the dev certificate and its password are
    # resolved from the mounted user secrets, not hardcoded.
    ports:
      - "44316:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
